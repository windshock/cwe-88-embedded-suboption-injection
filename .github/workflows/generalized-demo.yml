name: generalized-cwe88-demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cc --version
          python3 --version

      - name: Verify committed PoC integrity manifest
        run: |
          cd submission
          sha256sum -c evidence/sha256.txt

      - name: Run generalized demonstrator
        run: bash submission/scripts/run_demo.sh

      - name: Build submission package
        run: bash tools/make-submission.sh
