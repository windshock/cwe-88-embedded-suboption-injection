name: generalized-cwe88-demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cc --version
          python3 --version

      - name: Verify committed PoC integrity manifest
        run: |
          cd submission
          sha256sum -c evidence/sha256.txt

      - name: Run generalized demonstrator
        run: bash submission/scripts/run_demo.sh

      - name: Build submission package
        run: bash tools/make-submission.sh

      - name: Upload submission package
        uses: actions/upload-artifact@v4
        with:
          name: cwe-88-submission-package
          path: |
            dist/cwe-88-embedded-suboption-injection-submission.zip
            dist/cwe-88-embedded-suboption-injection-submission.zip.sha256
          if-no-files-found: error
